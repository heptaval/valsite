<!DOCTYPE html>
<html lang="en" xmlns:style="http://www.w3.org/1999/xhtml">
<head>
  <style>
    .div1 {
      text-align: center;
    }
    @font-face {
      font-family: SFPro; src: url("fonts/SFPro.otf") format("opentype")
    }
    @font-face {
      font-family: SFProBold; src: url("fonts/SFProBold.otf") format("opentype")
    }
    .header {
      color: #00eeff;
      font-family: SFPro;
      text-align: center;
      text-shadow: 0 0 15px #0097ab ;
      font-size: 60px;
      background-color: #00000082;
      padding: 25px;
      border-radius: 20px;
      fill-opacity: 50%;
      width: 45%;
      place-self: center;
    }
    body {
      background-image: linear-gradient(to bottom, black, #001a3a);
      height: auto;
      background-attachment: fixed;
      background-size: cover;
    }
    .paragraphs {
      color: #00eeff;
      font-family: SFPro;
      text-align: center;
      text-shadow: 0 0 15px #0097ab;
    }
  </style>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<div class="div1">
  <h1 class="header">Welcome to my Mashups Page!</h1>
  <p class="paragraphs" style="font-size: 200%">here you will find all of my mashups, gd or not!</p>
</div>
</body>
</html>
